<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jornada pela IA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="caixa-principal">
        <h1>Você decide o futuro da IA</h1>
        
        <!-- Tela de Introdução -->
        <div class="caixa-introducao">
            <p class="texto-introducao"></p>
            <button class="btn-iniciar">Iniciar Jornada</button>
        </div>

        <!-- Tela de Perguntas (inicia oculta) -->
        <div class="caixa-perguntas"></div>
        <div class="caixa-alternativas"></div>
        
        <!-- Tela de Resultado -->
        <div class="caixa-resultado">
            <p class="texto-resultado"></p>
            <button class="btn-novamente">Jogar Novamente</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
